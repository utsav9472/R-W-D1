<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <h1>Login Form</h1>
    <form>
        <input type="text" placeholder="Enter First Name" id="First_name" name="First_name">
        <input type="text" placeholder="Enter Last Name" id="Last_name" name="Last_name">
        <br>
        <input type="email" placeholder="Enter Email" id="Email" name="Email">
        <input type="password" placeholder="Enter Password" id="Password" name="Password">
        <br>
        <input type="radio" name="gender" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female">
        <label for="female">Female</label>
        <br>
        <input type="checkbox" name="hobbies" id="hobbies">
        <label for="hobbies">Reading</label>
        <input type="checkbox" name="hobbies" id="hobbies">
        <label for="hobbies">Coding</label>
        <br>
        <label>Upload your resume:</label><br>
        <input type="file" ><br>
        <label>Registration date :</label><br>
        <input type="date" ><br>
        <label>Choose your dream company:</label>
        <select >
            <option value="">--select</option>
            <option value="Google">Google</option>
            <option value="Microsoft">Microsoft</option>
            <option value="Apple">Apple</option>
            <option value="Amazon">Amazon</option>
        </select><br>
        <input type="submit" value="submit">
    </form>
</body>
</html>
